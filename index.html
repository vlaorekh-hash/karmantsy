<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Карманцы">
<meta name="theme-color" content="#172d52">
<title>Карманцы</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Golos+Text:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: one phone-width column sewn like a jeans pocket; orange thread marks everything you can touch, copper rivets are lives */
  --denim: #24457a;
  --denim-deep: #172d52;
  --denim-light: #3a62a3;
  --thread: #f2a93b;
  --paper: #f5ecd6;
  --ink: #14213a;
  --rivet: #d9824a;
  --hit: #ff6b57;
  --safe: #8fe0b4;
  --font-display: "Dela Gothic One", "Arial Black", Impact, sans-serif;
  --font-body: "Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--denim-deep);
  background-image:
    repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 2px, transparent 2px 5px),
    repeating-linear-gradient(25deg, rgba(0,0,0,.06) 0 1px, transparent 1px 4px);
  color: var(--paper);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
}
#app {
  max-width: 430px;
  min-height: 100%;
  margin: 0 auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: 30px; letter-spacing: .01em; }
h2 { font-size: 20px; }
p { margin: 0; }
.muted { opacity: .75; font-size: 14px; }
.thread { color: var(--thread); }

.patch {
  background: var(--denim);
  border: 2px dashed var(--thread);
  border-radius: 10px;
  padding: 14px;
  box-shadow: 0 0 0 4px var(--denim), 0 6px 0 4px rgba(0,0,0,.25);
  margin: 4px;
}
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.center { align-items: center; text-align: center; }

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--paper); outline-offset: 2px; }
.btn {
  font-family: var(--font-display);
  font-size: 18px;
  background: var(--thread);
  color: var(--ink);
  border: 0;
  border-radius: 8px;
  padding: 14px 18px;
  width: 100%;
  box-shadow: 0 4px 0 #a86a12;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a86a12; }
.btn[disabled] { background: #6f7f9c; color: #1d2c49; box-shadow: 0 4px 0 #4a5874; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--paper); border: 2px dashed var(--paper); box-shadow: none; font-family: var(--font-body); font-weight: 500; font-size: 16px; padding: 11px 18px; }

input[type=text] {
  font: inherit; font-weight: 500; font-size: 18px;
  width: 100%; padding: 12px;
  border-radius: 8px; border: 2px solid var(--denim-light);
  background: var(--denim-deep); color: var(--paper);
}
label { font-size: 14px; opacity: .8; }

/* fighters */
.fighter { display: flex; align-items: center; gap: 10px; }
.fighter svg { width: 64px; height: 64px; flex: none; }
.fighter .who { font-weight: 700; }
.rivets { display: flex; gap: 5px; }
.rivet { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f6c79d, var(--rivet) 55%, #8a4a22); box-shadow: 0 1px 0 rgba(0,0,0,.4); }
.rivet.lost { background: transparent; border: 2px solid rgba(245,236,214,.35); box-shadow: none; }
.tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--safe); color: var(--ink); }
.vs { font-family: var(--font-display); font-size: 14px; opacity: .6; text-align: center; }

/* planning grid */
.plan { display: grid; grid-template-columns: 58px 1fr 1fr; gap: 8px 8px; align-items: center; }
.plan .head { font-size: 13px; font-weight: 700; text-align: center; }
.plan .zone { font-weight: 700; font-size: 14px; }
.cell { display: flex; align-items: center; justify-content: space-between; background: var(--denim-deep); border-radius: 8px; padding: 4px; min-height: 44px; }
.cell.shielded { justify-content: center; background: var(--safe); color: var(--ink); font-weight: 700; font-size: 14px; }
.step { width: 34px; height: 34px; border-radius: 6px; border: 0; background: var(--denim-light); color: var(--paper); font-size: 20px; font-weight: 700; line-height: 1; }
.step[disabled] { opacity: .3; cursor: not-allowed; }
.pips { display: flex; gap: 4px; }
.pip { width: 11px; height: 11px; border-radius: 50%; border: 2px solid rgba(245,236,214,.4); }
.pip.atk.on { background: var(--hit); border-color: var(--hit); }
.pip.blk.on { background: var(--paper); border-color: var(--paper); }
.left { font-variant-numeric: tabular-nums; }
.shieldpick { display: flex; gap: 8px; }
.chip { flex: 1; padding: 9px 4px; border-radius: 8px; border: 2px dashed var(--safe); background: transparent; font-weight: 700; font-size: 14px; }
.chip.on { background: var(--safe); color: var(--ink); border-style: solid; }

/* reveal */
.reveal { display: grid; grid-template-columns: 58px 1fr 1fr; gap: 6px 8px; align-items: center; font-variant-numeric: tabular-nums; }
.reveal .head { font-size: 13px; font-weight: 700; text-align: center; }
.res { background: var(--denim-deep); border-radius: 8px; padding: 8px 6px; text-align: center; font-size: 14px; }
.res b { font-size: 16px; }
.res.dmg b { color: var(--hit); }
.res.zero b { color: var(--safe); }
.total { font-family: var(--font-display); font-size: 16px; text-align: center; }

/* step-by-step reveal */
.stage { display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; width: 100%; background: none; border: 0; padding: 0; color: inherit; }
.stage .dir { font-size: 14px; font-weight: 700; opacity: .85; }
.stage .zn { font-family: var(--font-display); font-size: 34px; line-height: 1; }
.clash { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; width: 100%; }
.side { background: var(--denim-deep); border-radius: 10px; padding: 12px 6px; min-height: 86px; display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center; }
.side .cap { font-size: 12px; font-weight: 700; opacity: .75; text-transform: uppercase; letter-spacing: .06em; }
.dots { display: flex; gap: 7px; min-height: 22px; align-items: center; }
.dot { width: 22px; height: 22px; border-radius: 50%; }
.dot.a { background: var(--hit); }
.dot.b { background: var(--paper); border-radius: 5px; }
.dot.a { animation: fly .35s cubic-bezier(.2,1.4,.4,1) both; }
.dot.a:nth-child(2) { animation-delay: .12s; } .dot.a:nth-child(3) { animation-delay: .24s; }
.qm { font-family: var(--font-display); font-size: 30px; animation: pulse .7s ease-in-out infinite alternate; }
.side.shieldbox { background: var(--safe); color: var(--ink); }
.side.shieldbox .big { font-family: var(--font-display); font-size: 22px; }
.arrow { font-family: var(--font-display); font-size: 22px; color: var(--thread); }
.verdict { font-family: var(--font-display); font-size: 30px; min-height: 40px; line-height: 1.1; }
.verdict.dmg { color: var(--hit); animation: slam .4s cubic-bezier(.2,1.6,.4,1) both; }
.verdict.zero { color: var(--safe); animation: pop .4s cubic-bezier(.2,1.6,.4,1) both; }
.verdict.wait { opacity: .35; font-size: 18px; font-family: var(--font-body); }
.flip { animation: flip .3s ease both; }
.progress { display: flex; gap: 6px; justify-content: center; }
.progress i { width: 22px; height: 5px; border-radius: 3px; background: rgba(245,236,214,.25); }
.progress i.done { background: var(--thread); }
.shake { animation: shake .45s ease; }
.rivet.just { animation: drop .5s ease both; }
.linkbtn { background: none; border: 0; text-decoration: underline; font-size: 14px; opacity: .8; padding: 8px; align-self: center; }
@keyframes fly { from { transform: translateX(-40px) scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pulse { from { opacity: .4; } to { opacity: 1; } }
@keyframes slam { 0% { transform: scale(2.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes flip { from { transform: rotateY(90deg); } to { transform: none; } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
@keyframes drop { 0% { transform: scale(1.6); background: var(--hit); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .dot.a, .qm, .verdict.dmg, .verdict.zero, .flip, .shake, .rivet.just { animation: none; } }

/* arena: two fighters face to face */
.head2 { display: flex; flex-direction: column; gap: 5px; }
.head2.bot { align-items: flex-end; text-align: right; }
.arena { display: grid; grid-template-columns: 84px 46px 1fr 46px 84px; grid-template-rows: repeat(3, 40px); gap: 6px; align-items: stretch; }
.cr { grid-row: 1 / 4; display: flex; align-items: center; }
.cr.l { grid-column: 1; } .cr.r { grid-column: 5; }
.cr svg { width: 84px; height: 84px; }
.slot { display: flex; align-items: center; justify-content: center; gap: 4px; background: var(--denim-deep); border-radius: 8px; font-weight: 700; font-size: 12px; border: 2px solid transparent; }
.slot.me { grid-column: 2; } .slot.bot { grid-column: 4; }
.slot .dot { width: 13px; height: 13px; border-radius: 3px; }
.slot .q { font-family: var(--font-display); font-size: 18px; opacity: .5; }
.slot .none { opacity: .45; font-weight: 500; }
.slot.sh { background: var(--safe); color: var(--ink); }
.slot.active { border-color: var(--thread); }
.slot.bad { border-color: var(--hit); background: #6b2a33; }
.slot.good { border-color: var(--safe); }
.lane { grid-column: 3; display: flex; align-items: center; justify-content: center; border-bottom: 2px dashed rgba(245,236,214,.15); }
.lane .zl { font-size: 12px; font-weight: 700; opacity: .4; text-transform: uppercase; letter-spacing: .06em; }
.lane.cur .zl { opacity: 1; color: var(--thread); }
.lane.ltr { justify-content: flex-end; } .lane.rtl { justify-content: flex-start; }
.lane .dots { gap: 4px; }
.lane .dot { width: 16px; height: 16px; }
.lane.ltr .dot.a { animation-name: flyR; } .lane.rtl .dot.a { animation-name: flyL; }
@keyframes flyR { from { transform: translateX(-90px) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes flyL { from { transform: translateX(90px) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }

/* pockets */
.pockets { display: flex; gap: 10px; }
.pocket { flex: 1; background: none; border: 0; padding: 0; position: relative; }
.pocket svg { width: 100%; height: auto; display: block; }
.pocket .lbl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; padding-bottom: 14%; }
.pocket.on svg .body { fill: var(--thread); }
.pocket.on .lbl { color: var(--ink); }
.pocket.sewn { opacity: .35; cursor: not-allowed; }

/* team, lobby */
.trio { display: flex; align-items: center; gap: 12px; }
.trio svg { width: 72px; height: 72px; flex: none; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; background: var(--denim); border: 2px solid var(--denim-light); border-radius: 10px; padding: 8px 12px; }
.opt svg { width: 54px; height: 54px; flex: none; }
.opt .mini { display: flex; width: 54px; flex: none; justify-content: center; }
.opt .mini svg { width: 24px; height: 24px; margin: 0 -3px; }
.opt.on { border-color: var(--thread); background: var(--denim-light); box-shadow: 0 0 0 2px var(--thread); }
.opt b { font-size: 17px; }

/* speed duels */
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.qside { display: flex; align-items: center; gap: 8px; }
.qside svg { width: 52px; height: 52px; flex: none; }
.qside.bot { flex-direction: row-reverse; text-align: right; }
.qside.bot .rivets { justify-content: flex-end; }
.count { font-family: var(--font-display); font-size: 96px; line-height: 1; text-align: center; color: var(--thread); padding: 20px 0; }
.task { font-family: var(--font-display); font-size: 34px; text-align: center; line-height: 1.2; overflow-wrap: anywhere; }
.task .ans { color: var(--thread); border-bottom: 3px dashed var(--thread); padding: 0 6px; min-width: 1.2em; display: inline-block; }
.task.word { font-size: 28px; letter-spacing: .04em; min-height: 44px; }
.mask { font-family: var(--font-display); font-size: 26px; letter-spacing: .12em; text-align: center; }
.numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.key { height: 54px; border: 0; border-radius: 8px; background: var(--denim-light); color: var(--paper); font-size: 22px; font-weight: 700; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
.key:active { transform: translateY(2px); box-shadow: none; }
.key.ok { background: var(--thread); color: var(--ink); }
.kb { display: flex; flex-direction: column; gap: 5px; margin: 0 -12px; }
.kb .krow { display: flex; gap: 3px; justify-content: center; }
.kb .key { flex: 1 1 0; min-width: 0; max-width: 34px; height: 46px; font-size: 17px; padding: 0; text-transform: uppercase; }
.kb .key.wide { max-width: 56px; flex: 1.8 1 0; font-size: 15px; }
.chips { display: flex; gap: 8px; }
.chips .chip { border-color: var(--thread); }
.chips .chip.on { background: var(--thread); }
.chips .chip[disabled] { opacity: .4; cursor: not-allowed; }

/* collection cards */
.mc { position: relative; width: 100%; aspect-ratio: 22 / 32; box-sizing: border-box; background: var(--paper); color: var(--ink); border-radius: 7px; padding: 5px; display: flex; flex-direction: column; gap: 4px; border: 2px solid transparent; box-shadow: 0 3px 0 rgba(0,0,0,.3); font: inherit; text-align: left; }
.mc .top { display: flex; justify-content: space-between; color: #fff; border-radius: 4px; padding: 2px 5px; font-size: 9px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.mc .art { background: #fff; border-radius: 4px; flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.mc .art svg { width: 100%; height: 100%; }
.mc .nm { font-family: var(--font-display); font-size: 10px; line-height: 1.1; min-height: 2.2em; }
.mc.big .top { font-size: 11px; padding: 4px 7px; } .mc.big .nm { font-size: 14px; min-height: 0; } .mc.big .fact { font-size: 11px; line-height: 1.3; }
.mc.s-d .top { background: #2f7a4a; } .mc.s-c .top { background: #b4531a; } .mc.s-f .top { background: #2459b3; }
.mc.rare { border-color: #c9971c; box-shadow: 0 0 0 2px #f2d27a, 0 3px 0 rgba(0,0,0,.3); }
.mc.rare .top { background: #c9971c; color: var(--ink); } .mc.rare .art { background: #fff8e1; }
.mc.ultra { background: #1b1530; color: var(--paper); border-color: #b58df1; box-shadow: 0 0 0 2px #f2d27a, 0 0 14px rgba(181,141,241,.6); }
.mc.ultra .top { background: #b58df1; color: var(--ink); } .mc.ultra .art { background: #2a2148; }
.mc.limited { background: var(--ink); color: #f2d27a; border-color: #f2d27a; }
.mc.limited .top { background: var(--ink); color: #f2d27a; border: 1px solid #f2d27a; } .mc.limited .art { background: #1d2e52; }
.mc .cnt { position: absolute; top: -7px; right: -7px; background: var(--thread); color: var(--ink); font-weight: 700; font-size: 12px; border-radius: 99px; padding: 1px 7px; }
.mc .glued { position: absolute; left: 50%; bottom: 34%; transform: translateX(-50%) rotate(-8deg); background: var(--safe); color: var(--ink); font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
button.mc { cursor: pointer; }
.mc:not(.big) .top { justify-content: center; }
.mc:not(.big) .top span:first-child { display: none; }
.grid5 .mc { padding: 3px; gap: 3px; } .grid5 .mc .top { font-size: 8px; padding: 1px 2px; } .grid5 .mc .nm { font-size: 8px; min-height: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
button.mc.sel { outline: 3px solid var(--thread); outline-offset: 2px; }
.slot-empty { width: 100%; aspect-ratio: 22 / 32; border: 2px dashed rgba(245,236,214,.35); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 18px; opacity: .55; box-sizing: border-box; text-align: center; }
.slot-empty.small { font-family: var(--font-body); font-size: 10px; font-weight: 700; padding: 4px; }
.grid5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 10px; }
.serhead { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; }
.toast { background: var(--safe); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-weight: 700; }
.bar { position: sticky; bottom: 8px; display: flex; flex-direction: column; gap: 8px; background: var(--denim-deep); border: 2px solid var(--thread); border-radius: 12px; padding: 10px; }
.hscroll { display: flex; gap: 10px; overflow-x: auto; padding: 8px 4px 10px; }
.hscroll .mc { width: 84px; flex: none; }
.big-cards { display: flex; gap: 14px; justify-content: center; }
.big-cards > div { width: 140px; display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; }
.big-cards .mc.gone { opacity: .45; filter: grayscale(1); }

/* two players, one phone */
.cover { display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
.cover svg { width: 130px; height: 130px; }
.names { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.duo { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; position: fixed; inset: 0; z-index: 5; background-color: var(--denim-deep); display: grid; grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr); }
.half { display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 10px 12px; min-height: 0; overflow: hidden; }
.half.top { transform: rotate(180deg); }
.half .hhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.half .hhead .row { gap: 6px; }
.half .hhead svg { width: 40px; height: 40px; }
.half .count { font-size: 64px; padding: 0; }
.half .task { font-size: 30px; }
.half .task.word { font-size: 24px; min-height: 0; }
.half .mask { font-size: 22px; }
.half .msg { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.half .msg .verdict { font-size: 26px; min-height: 0; }
.numpad.sm { gap: 6px; } .numpad.sm .key { height: 44px; font-size: 20px; }
.half .kb { margin: 0 -8px; } .half .kb .key { height: 40px; }
.mid { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px; background: var(--denim); border-block: 2px dashed var(--thread); }
.mid .btn { width: auto; padding: 10px 16px; font-size: 16px; }
.mid .linkbtn { padding: 6px; }

/* duo setup, voices, win effects */
.half.setup { justify-content: flex-start; gap: 8px; }
.half .egg-sm { background: none; border: 0; padding: 0; width: 120px; align-self: center; }
.half .egg-sm svg { width: 100%; height: auto; display: block; }
.hero { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; gap: 6px; align-items: center; }
.hero svg { width: 44px; height: 44px; }
.hero input { font-size: 15px; padding: 8px; }
.hero .rl { font-size: 11px; opacity: .7; grid-column: 2 / 5; margin-bottom: -4px; }
.ibtn { width: 40px; height: 40px; border-radius: 8px; border: 2px solid var(--thread); background: transparent; color: var(--paper); display: flex; align-items: center; justify-content: center; padding: 0; position: relative; }
.ibtn svg { width: 20px; height: 20px; }
.ibtn.has { background: var(--thread); color: var(--ink); }
.ibtn.rec { background: var(--hit); border-color: var(--hit); color: #fff; font-weight: 700; font-size: 15px; }
.ibtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.pname { display: flex; gap: 8px; align-items: center; } .pname label { white-space: nowrap; }
.pname input { font-size: 15px; padding: 8px; }
.okbadge { background: var(--safe); color: var(--ink); font-weight: 700; border-radius: 8px; padding: 10px; text-align: center; }
.vsbanner { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(15, 26, 48, .95); }
.vsbanner .in { display: flex; flex-direction: column; align-items: center; gap: 6px; animation: pop .45s cubic-bezier(.2,1.6,.4,1) both; }
.vsbanner .pair { display: flex; align-items: center; gap: 14px; }
.vsbanner .pair > div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--font-display); font-size: 22px; text-align: center; max-width: 140px; overflow-wrap: anywhere; }
.vsbanner svg { width: 110px; height: 110px; }
.vsbanner .x { font-family: var(--font-display); font-size: 26px; color: var(--thread); }
.vsbanner .top { transform: rotate(180deg); }
.half { position: relative; }
.winfx { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 3; }
.winfx .chk { width: 150px; height: 150px; animation: winpop 2.2s ease forwards; }
.winfx .chk circle { fill: #2fb36b; }
.winfx .chk path { fill: none; stroke: #fff; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw .45s .2s ease forwards; }
.spark { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; border-radius: 3px; animation: burst 1.3s ease-out forwards; }
@keyframes winpop { 0% { transform: scale(.2); opacity: 0; } 15% { transform: scale(1.15); opacity: 1; } 25% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(1); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes burst { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--r)) scale(.6); opacity: 0; } }
.fwrap { position: relative; display: flex; justify-content: center; }
.fwrap .spark { animation-iteration-count: 3; }
@media (prefers-reduced-motion: reduce) { .winfx .chk, .winfx .chk path, .spark, .vsbanner .in { animation: none; } .winfx .chk path { stroke-dashoffset: 0; } .spark { display: none; } }

/* rock paper scissors */
.rps-picks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.rps-btn { background: var(--denim); border: 2px solid var(--denim-light); border-radius: 12px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 700; font-size: 14px; }
.rps-btn svg { width: 64px; height: 64px; }
.rps-btn:active { border-color: var(--thread); }
.rps-big { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.rps-big svg { width: 120px; height: 120px; }
.shake svg.fist { animation: fist .45s ease-in-out 3; transform-origin: 50% 90%; }
.reveal-pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes fist { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-22px) rotate(-8deg); } }
@media (prefers-reduced-motion: reduce) { .shake svg.fist, .reveal-pop { animation: none; } }

/* вкладыш */
.inserts { display: flex; gap: 12px; justify-content: center; }
.insert { width: 132px; background: var(--paper); color: var(--ink); border-radius: 4px; padding: 8px; transform: rotate(-3deg); box-shadow: 0 5px 0 rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 4px; }
.insert:nth-child(2) { transform: rotate(4deg); }
.insert.gone { opacity: .45; filter: grayscale(1); }
.insert .series { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; display: flex; justify-content: space-between; }
.insert .art { background: #e3d5b0; border-radius: 3px; height: 74px; display: flex; align-items: center; justify-content: center; }
.insert .art svg { height: 56px; }
.insert .nm { font-family: var(--font-display); font-size: 13px; line-height: 1.15; }
.insert .own { font-size: 11px; opacity: .7; }

/* egg */
.eggbtn { background: none; border: 0; padding: 0; width: 190px; align-self: center; }
.eggbtn svg { width: 100%; height: auto; display: block; }
.wobble { animation: wobble .35s ease; }
.pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
@keyframes wobble { 0%{transform:rotate(0)} 25%{transform:rotate(-7deg)} 60%{transform:rotate(6deg)} 100%{transform:rotate(0)} }
@keyframes pop { 0%{transform:scale(.6)} 100%{transform:scale(1)} }
@media (prefers-reduced-motion: reduce) { .wobble, .pop { animation: none; } }
.newborn { width: 170px; height: 170px; align-self: center; }
.note { font-size: 13px; opacity: .7; text-align: center; }

html, body { overscroll-behavior: none; }
body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
.code { font-family: var(--font-display); font-size: 56px; letter-spacing: .15em; color: var(--thread); line-height: 1; }
.qr { background: #fff; border-radius: 10px; padding: 8px; width: 220px; height: 220px; }
.qr svg { width: 100%; height: 100%; display: block; }
.key, .rps-btn { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
.opt .tag { flex: none; }

    <div class="patch stack center"><div class="fwrap">${creature(winHero, 'newborn pop')}${won ? winFx() : ''}</div><p>${how}</p></div>
    ${stake}
    <button class="btn" data-act="rematch">Ещё бой</button>
    <button class="btn ghost" data-act="album">Карман и альбом</button>
    <button class="btn ghost" data-act="cancel">Выйти</button>`;
}
function vAlbum() {
  const A = P.col.album, g = grouped(P.col.pocket), sel = U.sel;
  let bar = '';
  if (sel) {
    const c = CARDS[sel], glued = isGlued(sel);
    const hint = c.tier === 'limited' ? 'Лимитированную не вклеивают.' : glued ? 'Такая уже вклеена. Это повторка: ставь её на кон.' : 'Вклеенная карточка уходит из кармана навсегда: на кон её поставить уже нельзя.';
    bar = `<div class="bar"><b>${c.name}</b><span class="muted">${hint}</span>${!glued && c.tier !== 'limited' ? '<button class="btn" data-act="glue">Вклеить в альбом</button>' : ''}</div>`;
  }
  const row = s => `<div class="stack" style="gap:6px"><div class="serhead"><span>${SERIES[s]}</span><span class="muted">${A[s].length} из 5</span></div>
    <div class="grid5">${[1,2,3,4,5].map(n => A[s].includes(s + n) ? mc(s + n) : `<div class="slot-empty">${n}</div>`).join('')}</div></div>`;
  return `<h1>Карман и альбом</h1>
    ${U.toast ? `<div class="toast">${U.toast}</div>` : ''}
    <div class="patch stack">
      <div class="row between"><h2>В кармане: ${P.col.pocket.length}</h2><button class="chip" style="flex:none;padding:8px 12px;border-color:var(--thread)" data-act="gum">3 случайные</button></div>
      <p class="muted">Нажми на карточку, чтобы вклеить. Повторки оставляй для ставок.</p>
      ${g.length ? `<div class="grid4">${g.map(x => mc(x.id, { count: x.n, act: 'sel', sel: sel === x.id, glued: isGlued(x.id) })).join('')}</div>` : '<p>Карман пуст.</p>'}
    </div>
    <div class="patch stack"><h2>Альбом</h2>${row('d')}${row('c')}${row('f')}
      <div class="stack" style="gap:6px"><div class="serhead"><span>Редкие и выше</span><span class="muted">${A.rare.length} из 3</span></div>
        <div class="grid5">${['rd','rc','rf'].map(id => A.rare.includes(id) ? mc(id) : `<div class="slot-empty small">Собери серию «${CARDS[id].ser}»</div>`).join('')}
          ${A.ultra ? mc('ux') : '<div class="slot-empty small">Три редкие</div>'}<div class="slot-empty small">От мастера игры</div></div></div></div>
    ${bar}
    <button class="btn ghost" data-act="back">Назад</button>
    <button class="linkbtn" data-act="colreset">Начать коллекцию заново</button>`;
}
function vBanner() {
  if (!BANNER || !OPP) return '';
  const a = OPP.team[BANNER.role], b = P.team[BANNER.role];
  return `<button class="vsbanner" data-act="banner" aria-label="Закрыть"><div class="in"><div class="pair">
    <div>${creature(a)}${esc(a.name)}</div><span class="x">против</span><div>${creature(b)}${esc(b.name)}</div></div></div></button>`;
}
function render() {
  const views = { stakes: vStakes, egg: vEgg, firstheroes: () => vHeroes(true), heroes: () => vHeroes(false), home: vHome, host: vHost, join: vJoin, joining: vJoining, lost: vLost, lobby: vLobby, intro: vIntro, duel: vDuel, result: vResult, album: vAlbum };
  const app = document.getElementById('app');
  const focus = document.activeElement && document.activeElement.id;
  app.innerHTML = (views[U.screen] || vHome)() + vBanner();
  U.anim = '';
  if (focus) { const el = document.getElementById(focus); if (el && el.tagName === 'INPUT') { el.focus(); const v = el.value; try { el.setSelectionRange(v.length, v.length); } catch (e) {} } }
}

/* ---------- input ---------- */
function key(k) {
  if (!G || G.phase !== 'play' || U.sent || U.count > 0) return;
  const math = G.role === 'math';
  if (k === 'bksp') U.input = U.input.slice(0, -1);
  else if (U.input.length < (math ? 4 : 14)) U.input += k;
  const el = document.getElementById('ans'); if (el) el.innerHTML = U.input ? esc(U.input) : (math ? '?' : '…');
}
const FAST = new Set(['key', 'bksp', 'submit', 'rpick']);
let fastUntil = 0;
function act(t) {
  const a = t.dataset.act;
  switch (a) {
    case 'tap':
      U.taps++;
      if (U.taps >= 3) {
        const names = NAMES.slice().sort(() => Math.random() - .5), c0 = rnd(5), team = {};
        ROLES.forEach((r, i) => { team[r.id] = { role: r.id, kind: rnd(3), color: COLORS[(c0 + i) % 5], name: names[i] }; });
        P = { name: '', team, mlevel: 1, wlevel: 1, wlang: 'en', sound: true, starter: null, col: null };
        U.screen = 'firstheroes'; U.anim = 'pop';
      } else U.anim = 'wobble';
      break;
    case 'starter': P.starter = t.dataset.k; break;
    case 'heroesdone':
      if (!P.col) { if (!P.starter) return; P.col = newCol(P.starter); }
      P.name = (P.name || '').trim() || 'Игрок';
      ROLES.forEach(r => { const c = P.team[r.id]; c.name = (c.name || '').trim() || r.name; });
      saveP(); U.screen = U.joinCode ? 'join' : 'home'; break;
    case 'heroes': U.screen = 'heroes'; break;
    case 'rec': startRec(t.dataset.k); return;
    case 'recstop': if (U.rec) { try { U.rec.mr.stop(); } catch (e) {} } return;
    case 'hear': stopSpeech(); sayHero(true, t.dataset.k); return;
    case 'host': U.toast = ''; hostGame(); return;
    case 'tojoin': U.toast = ''; U.err = ''; U.screen = 'join'; break;
    case 'join': joinGame(U.joinCode); return;
    case 'cancel': send({ t: 'leave' }); closeNet(); G = null; BANNER = null; stopSpeech(); U.screen = 'home'; U.err = ''; history.replaceState(null, '', location.pathname + location.search); break;
    case 'album': U.back = U.screen; U.sel = null; U.toast = ''; U.screen = 'album'; break;
    case 'back': U.screen = U.back === 'result' && G ? 'result' : U.back === 'lobby' && conn ? 'lobby' : 'home'; U.toast = ''; if (LOB && LOB.stake && !P.col.pocket.includes(LOB.stake)) { LOB.stake = null; LOB.ready = false; pushLob(); } break;
    case 'sel': U.sel = U.sel === t.dataset.id ? null : t.dataset.id; U.toast = ''; break;
    case 'glue': if (U.sel) glue(U.sel); break;
    case 'gum': { const got = [pick(commons()), pick(commons()), pick(commons())]; P.col.pocket.push(...got); U.toast = 'Получено: ' + got.map(id => '«' + CARDS[id].name + '»').join(', ') + '.'; U.sel = null; saveP(); if (conn) send({ t: 'prof', p: summary() }); break; }
    case 'colreset': P.col = newCol(P.starter || 'd'); U.sel = null; U.toast = 'Коллекция начата заново: стартовый набор в кармане.'; saveP(); break;
    case 'pick': U.toast = ''; LOB.pick = t.dataset.id; LOB.ready = false; pushLob(); return;
    case 'rated': LOB.rated = t.dataset.on === '1'; LOB.ready = false; if (!LOB.rated) LOB.stake = null; pushLob(); return;
    case 'stake': LOB.stake = t.dataset.id; LOB.ready = false; pushLob(); return;
    case 'ready': LOB.ready = !LOB.ready; pushLob(); return;
    case 'mlevel': P.mlevel = +t.dataset.l; saveP(); send({ t: 'prof', p: summary() }); break;
    case 'wlevel': P.wlevel = +t.dataset.l; saveP(); send({ t: 'prof', p: summary() }); break;
    case 'wlang': P.wlang = t.dataset.l; saveP(); send({ t: 'prof', p: summary() }); break;
    case 'sound': P.sound = t.dataset.on === '1'; saveP(); send({ t: 'prof', p: summary() }); break;
    case 'introready':
      if (U.ready) return; U.ready = true; announce(G.role);
      if (isHost) { G.ready.h = true; maybeRound(); } else send({ t: 'ready' });
      break;
    case 'accept': if (isHost) acceptStake('h', true); else { G.accept.g = true; send({ t: 'accept', ok: true }); } break;
    case 'decline': if (isHost) acceptStake('h', false); else send({ t: 'accept', ok: false }); return;
    case 'banner': BANNER = null; break;
    case 'key': key(t.dataset.k); return;
    case 'bksp': key('bksp'); return;
    case 'submit': submit(); return;
    case 'rpick': myRps(t.dataset.k); return;
    case 'repeat': sayWord(); return;
    case 'nosound': P.sound = false; saveP(); break;
    case 'rematch': G = null; LOB.ready = false; if (LOB.stake && !P.col.pocket.includes(LOB.stake)) LOB.stake = null; U.screen = 'lobby'; pushLob(); return;
  }
  render();
}
const app = document.getElementById('app');
app.addEventListener('pointerdown', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled || !FAST.has(t.dataset.act)) return;
  e.preventDefault(); fastUntil = Date.now() + 700; act(t);
});
app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  if (FAST.has(t.dataset.act) && Date.now() < fastUntil) return;
  act(t);
});
app.addEventListener('input', e => {
  const d = e.target.dataset || {};
  if (d.hname && P) P.team[d.hname].name = e.target.value;
  if (d.pn && P) P.name = e.target.value;
  if (d.jc) U.joinCode = e.target.value.replace(/[^0-9]/g, '');
});
app.addEventListener('change', e => {
  const role = e.target.dataset && e.target.dataset.voice; if (!role || !e.target.files || !e.target.files[0]) return;
  const f = e.target.files[0];
  if (f.size > 1000000) { toast('Запись слишком длинная: нужно до 5 секунд.'); return; }
  const fr = new FileReader(); fr.onload = () => { VOICES[role] = fr.result; saveVoices(); render(); playClip(VOICES[role]); }; fr.readAsDataURL(f);
});
app.addEventListener('focusout', e => { if (P && (e.target.dataset.hname || e.target.dataset.pn)) saveP(); });
document.addEventListener('keydown', e => {
  if (!G || G.phase !== 'play' || U.screen !== 'duel' || G.role === 'war') return;
  const k = e.key.toLowerCase(), tk = myTask();
  if (k === 'backspace') { key('bksp'); e.preventDefault(); }
  else if (k === 'enter') submit();
  else if (G.role === 'math' ? /^[0-9]$/.test(k) : (tk && tk.lang === 'ru' ? /^[а-яё]$/ : /^[a-z]$/).test(k)) key(k);
});

/* ---------- start ---------- */
if (P && !P.col) { U.screen = 'firstheroes'; }
const m0 = (location.hash || '').match(/^#join-([0-9]{4})$/);
if (m0) { U.joinCode = m0[1]; if (P && P.col) { U.screen = 'join'; setTimeout(() => joinGame(U.joinCode), 300); } }
render();

</script>
</body>
</html>
